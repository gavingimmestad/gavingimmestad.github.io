<!DOCTYPE html>
<html>
<head>
  <title>Climate Change</title>
  <style>
    body {
      background-color: #060b1a;
      overflow: hidden;
      height: 100vh;
      margin: 0px;
      padding: 0px;
      text-align: center;
    }

    canvas {
      position: fixed;
      top: 0px;
      left: 0px;
    }

    #maintext {
      position: relative;
      z-index: 1;
      color: white;
      font-family: Georgia;
      font-size: 32px;
      padding-top: 200px;
    }

    #links {
      position: relative;
      z-index: 1;
      padding-top: 20px;
      font-family: Georgia;
      font-size: 16px;
    }

    #links a {
      color: #8cc8ff;
    }
  </style>
</head>
<body>

  <canvas id="bg"></canvas>

  <div id="maintext">Climate Change</div>

<div id="links">
    <a href="drivers/index.html">Drivers </a>|
    <a href="impacts/index.html">Impacts </a>|
    <a href="personalex/index.html">The Future</a>
</div>


  <script>

    var canvas = document.getElementById("bg");
    var ctx = canvas.getContext("2d");

    var mouseX = -999;
    var mouseY = -999;

    var bubbles = [];
    var numberOfBubbles = 100;

    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;

    // bub
    for (var i = 0; i < numberOfBubbles; i++) {
      var bubble = {
        x: Math.random() * canvas.width,
        y: Math.random() * canvas.height,
        radius: Math.random() * 6 + 6,
        speedX: Math.random() * 0.2 - 0.1,
        speedY: Math.random() * -0.5 - 0.1,
        alpha: Math.random() * 0.25 + 0.05
      };
      bubbles.push(bubble);
    }

    // mouse pos
    window.addEventListener("mousemove", function(e) {
      mouseX = e.clientX;
      mouseY = e.clientY;
    });

    window.addEventListener("mouseleave", function() {
      mouseX = -999;
      mouseY = -999;
    });

    window.addEventListener("resize", function() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    });

    function draw() {

      ctx.clearRect(0, 0, canvas.width, canvas.height);

      for (var i = 0; i < bubbles.length; i++) {

        var b = bubbles[i];

        // mouse velo
        var dx = b.x - mouseX;
        var dy = b.y - mouseY;
        var distance = Math.sqrt(dx * dx + dy * dy);

        if (distance < 120) {
          var force = (120 - distance) / 120;
          b.speedX = b.speedX + (dx / distance) * force * 0.15;
          b.speedY = b.speedY + (dy / distance) * force * 0.15;
        }

        // stop
        b.speedX = b.speedX * 0.97;
        b.speedY = b.speedY * 0.97;

        // velo
        b.x = b.x + b.speedX;
        b.y = b.y + b.speedY;

        // wrap
        if (b.x < -b.radius) {
          b.x = canvas.width + b.radius;
        }
        if (b.x > canvas.width + b.radius) {
          b.x = -b.radius;
        }
        if (b.y < -b.radius) {
          b.y = canvas.height + b.radius;
          b.x = Math.random() * canvas.width;
        }
        if (b.y > canvas.height + b.radius) {
          b.y = -b.radius;
        }

        // draw bub
        ctx.beginPath();
        ctx.arc(b.x, b.y, b.radius, 0, Math.PI * 2);
        ctx.strokeStyle = "rgba(140, 200, 255, " + b.alpha * 2 + ")";
        ctx.lineWidth = 1;
        ctx.stroke();

      }

      requestAnimationFrame(draw);
    }

    draw();

  </script>

</body>
</html>
